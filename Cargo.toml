[package]
name = "sensors-to-mqtt"
version = "0.6.1"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-only"
description = "Sensors (I2C, GPIO, serial, TCP bridge) to MQTT for the G86 telemetry ecosystem: canonical telemetry, on demand, HTTP API, web dashboard and TUI"
repository = "https://github.com/askrejans/sensors-to-mqtt"
readme = "README.md"

[dependencies]
# Async runtime
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs"] }
tokio-util = "0.7.20"
futures-util = "0.3.34"

# I2C (cross-platform trait only; Linux HAL is in target-specific section below)
embedded-hal = "1.0.0"

# Configuration
config = "0.15.27"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

# MQTT (pure Rust, rustls)
rumqttc = "0.25.1"

# HTTP API, Prometheus text exposition, web dashboard
axum = "0.8.9"

# TUI
ratatui = "0.30.2"
crossterm = "0.29.0"

# Logging / tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }

# CLI
clap = { version = "4.6.7", features = ["derive"] }

# Error handling
anyhow = "1.0.104"
thiserror = "2.0.21"

# Data
chrono = { version = "0.4.45", features = ["serde"] }
serialport = "4.10.1"

# I2C hardware drivers — Linux/Android only
[target.'cfg(target_os = "linux")'.dependencies]
i2cdev = "0.6.2"
linux-embedded-hal = "0.5.0"
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
