# --- ADS1115: 4-channel 16-bit ADC (analog inputs) ------------------------
# [[sensors]]
# name   = "analog"
# driver = "ads1115"
# enabled = true
#
# [sensors.connection]
# type    = "i2c"
# device  = "/dev/i2c-1"
# address = 0x48   # 0x48–0x4B depending on ADDR pin
#
# [sensors.settings]
# gain        = 4.096   # PGA full-scale range (V): 6.144|4.096|2.048|1.024|0.512|0.256
# sample_rate = 128     # SPS: 8|16|32|64|128|250|475|860
#
# [[sensors.settings.channels]]
# index  = 0
# label  = "Throttle"
# unit   = "%"
# scale  = 25.6
# offset = 0.0
#
# [[sensors.settings.channels]]
# index  = 1
# label  = "Coolant Temp"
# unit   = "C"
# scale  = 100.0
# offset = -1.0

